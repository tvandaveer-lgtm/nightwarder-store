    <text x="328" y="54" fill="#c4a894" font-size="10" font-weight="600" letter-spacing="1.4" text-anchor="end">KIT COVER</text>
  </g>
  <line x1="32" y1="66" x2="328" y2="66" stroke="#e06a2a" stroke-opacity="0.35" stroke-width="1"/>

  
      <g transform="translate(180 198)">
