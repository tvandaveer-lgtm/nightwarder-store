<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-label="NightWarder kit cover: Heat illness SOP">
  <title>NightWarder kit cover — Heat illness SOP</title>
  <defs>
