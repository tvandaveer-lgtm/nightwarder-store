<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-label="NightWarder kit cover: Member meeting packet">
  <title>NightWarder kit cover — Member meeting packet</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141618"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3e4650"/>
      <stop offset="1" stop-color="#8a94a0"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#eef0f3" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="360" height="480" fill="url(#bg)"/>
  <rect width="360" height="480" fill="url(#grid)"/>
  <rect x="0" y="0" width="360" height="10" fill="url(#bar)"/>
  <rect x="18" y="18" width="324" height="444" rx="10" fill="none" stroke="#8a94a0" stroke-opacity="0.28" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="54" fill="#8a94a0" font-size="11" font-weight="700" letter-spacing="2.4">NIGHTWARDER</text>
    <text x="328" y="54" fill="#a8b0b8" font-size="10" font-weight="600" letter-spacing="1.4" text-anchor="end">KIT COVER</text>
  </g>
  <line x1="32" y1="66" x2="328" y2="66" stroke="#8a94a0" stroke-opacity="0.35" stroke-width="1"/>

  
      <g transform="translate(180 198)">
        <rect x="-44" y="-36" width="88" height="72" rx="5" fill="none" stroke="#8a94a0" stroke-width="3"/>
        <rect x="-30" y="-20" width="60" height="5" rx="2" fill="#8a94a0"/>
        <rect x="-30" y="-6" width="44" height="4" rx="2" fill="#eef0f3" opacity="0.45"/>
        <rect x="-30" y="6" width="50" height="4" rx="2" fill="#eef0f3" opacity="0.45"/>
        <rect x="-30" y="18" width="36" height="4" rx="2" fill="#eef0f3" opacity="0.45"/>
      </g>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="32" y="310" fill="#eef0f3" font-size="26" font-weight="700">Member meeting packet</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="336" fill="#a8b0b8" font-size="13">Agenda and minutes</text>
    <rect x="32" y="354" width="118" height="22" rx="11" fill="#8a94a0" fill-opacity="0.16" stroke="#8a94a0" stroke-opacity="0.45"/>
    <text x="91" y="369" fill="#8a94a0" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">PACKET KIT</text>
    <text x="32" y="416" fill="#a8b0b8" font-size="11">Blank template cover</text>
    <text x="32" y="434" fill="#a8b0b8" font-size="11" opacity="0.8">Not a live spreadsheet screenshot</text>
  </g>
</svg>
