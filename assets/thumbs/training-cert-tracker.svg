<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-label="NightWarder kit cover: Training cert tracker">
  <title>NightWarder kit cover — Training cert tracker</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10161a"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f4554"/>
      <stop offset="1" stop-color="#3f7f96"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#e6f1f4" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="360" height="480" fill="url(#bg)"/>
  <rect width="360" height="480" fill="url(#grid)"/>
  <rect x="0" y="0" width="360" height="10" fill="url(#bar)"/>
  <rect x="18" y="18" width="324" height="444" rx="10" fill="none" stroke="#3f7f96" stroke-opacity="0.28" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="54" fill="#3f7f96" font-size="11" font-weight="700" letter-spacing="2.4">NIGHTWARDER</text>
    <text x="328" y="54" fill="#95b0b8" font-size="10" font-weight="600" letter-spacing="1.4" text-anchor="end">KIT COVER</text>
  </g>
  <line x1="32" y1="66" x2="328" y2="66" stroke="#3f7f96" stroke-opacity="0.35" stroke-width="1"/>

  
      <g transform="translate(180 198)">
        <path d="M0 -44 L36 -28 L36 8 C36 28 18 42 0 48 C-18 42 -36 28 -36 8 L-36 -28 Z"
              fill="none" stroke="#3f7f96" stroke-width="3"/>
        <circle cx="0" cy="-2" r="14" fill="#3f7f96"/>
        <path d="M-6 2 L-1 7 L8 -6" fill="none" stroke="#e6f1f4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="32" y="310" fill="#e6f1f4" font-size="26" font-weight="700">Training cert tracker</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="336" fill="#95b0b8" font-size="13">Certs and renewals</text>
    <rect x="32" y="354" width="118" height="22" rx="11" fill="#3f7f96" fill-opacity="0.16" stroke="#3f7f96" stroke-opacity="0.45"/>
    <text x="91" y="369" fill="#3f7f96" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">TRACKER KIT</text>
    <text x="32" y="416" fill="#95b0b8" font-size="11">Blank template cover</text>
    <text x="32" y="434" fill="#95b0b8" font-size="11" opacity="0.8">Not a live spreadsheet screenshot</text>
  </g>
</svg>
