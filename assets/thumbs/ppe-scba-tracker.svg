<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-label="NightWarder kit cover: PPE / SCBA tracker">
  <title>NightWarder kit cover — PPE / SCBA tracker</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181410"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e4a1a"/>
      <stop offset="1" stop-color="#c4893a"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#f4eee4" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="360" height="480" fill="url(#bg)"/>
  <rect width="360" height="480" fill="url(#grid)"/>
  <rect x="0" y="0" width="360" height="10" fill="url(#bar)"/>
  <rect x="18" y="18" width="324" height="444" rx="10" fill="none" stroke="#c4893a" stroke-opacity="0.28" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="54" fill="#c4893a" font-size="11" font-weight="700" letter-spacing="2.4">NIGHTWARDER</text>
    <text x="328" y="54" fill="#c0b09a" font-size="10" font-weight="600" letter-spacing="1.4" text-anchor="end">KIT COVER</text>
  </g>
  <line x1="32" y1="66" x2="328" y2="66" stroke="#c4893a" stroke-opacity="0.35" stroke-width="1"/>

  
      <g transform="translate(180 198)">
        <path d="M0 -44 L40 -28 L40 6 C40 28 20 44 0 50 C-20 44 -40 28 -40 6 L-40 -28 Z"
              fill="none" stroke="#c4893a" stroke-width="3.5"/>
        <path d="M0 -26 L18 -18 L18 4 C18 16 8 26 0 30 C-8 26 -18 16 -18 4 L-18 -18 Z" fill="#c4893a"/>
      </g>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="32" y="310" fill="#f4eee4" font-size="26" font-weight="700">PPE / SCBA tracker</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="336" fill="#c0b09a" font-size="13">Inventory and inspection</text>
    <rect x="32" y="354" width="118" height="22" rx="11" fill="#c4893a" fill-opacity="0.16" stroke="#c4893a" stroke-opacity="0.45"/>
    <text x="91" y="369" fill="#c4893a" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">TRACKER KIT</text>
    <text x="32" y="416" fill="#c0b09a" font-size="11">Blank template cover</text>
    <text x="32" y="434" fill="#c0b09a" font-size="11" opacity="0.8">Not a live spreadsheet screenshot</text>
