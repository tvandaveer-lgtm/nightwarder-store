<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-label="NightWarder kit cover: Donation register">
  <title>NightWarder kit cover — Donation register</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1710"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e5618"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#f6f0de" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="360" height="480" fill="url(#bg)"/>
  <rect width="360" height="480" fill="url(#grid)"/>
  <rect x="0" y="0" width="360" height="10" fill="url(#bar)"/>
  <rect x="18" y="18" width="324" height="444" rx="10" fill="none" stroke="#c9a24a" stroke-opacity="0.28" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="54" fill="#c9a24a" font-size="11" font-weight="700" letter-spacing="2.4">NIGHTWARDER</text>
    <text x="328" y="54" fill="#c4b48a" font-size="10" font-weight="600" letter-spacing="1.4" text-anchor="end">KIT COVER</text>
  </g>
  <line x1="32" y1="66" x2="328" y2="66" stroke="#c9a24a" stroke-opacity="0.35" stroke-width="1"/>

  
      <g transform="translate(180 198)">
        <path d="M-40 -6 L0 -26 L40 -6 L0 14 Z" fill="#c9a24a"/>
        <path d="M-40 -6 L-40 22 L0 42 L0 14 Z" fill="#c9a24a" opacity="0.7"/>
        <path d="M40 -6 L40 22 L0 42 L0 14 Z" fill="#c9a24a" opacity="0.45"/>
      </g>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="32" y="310" fill="#f6f0de" font-size="26" font-weight="700">Donation register</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="336" fill="#c4b48a" font-size="13">Fundraising log</text>
    <rect x="32" y="354" width="118" height="22" rx="11" fill="#c9a24a" fill-opacity="0.16" stroke="#c9a24a" stroke-opacity="0.45"/>
    <text x="91" y="369" fill="#c9a24a" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">REGISTER KIT</text>
    <text x="32" y="416" fill="#c4b48a" font-size="11">Blank template cover</text>
    <text x="32" y="434" fill="#c4b48a" font-size="11" opacity="0.8">Not a live spreadsheet screenshot</text>
  </g>
