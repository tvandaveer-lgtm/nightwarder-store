<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-label="NightWarder kit cover: Exposure / near-miss">
  <title>NightWarder kit cover — Exposure / near-miss</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1710"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e5a12"/>
      <stop offset="1" stop-color="#d4b03a"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#f6f1dc" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="360" height="480" fill="url(#bg)"/>
  <rect width="360" height="480" fill="url(#grid)"/>
  <rect x="0" y="0" width="360" height="10" fill="url(#bar)"/>
  <rect x="18" y="18" width="324" height="444" rx="10" fill="none" stroke="#d4b03a" stroke-opacity="0.28" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="54" fill="#d4b03a" font-size="11" font-weight="700" letter-spacing="2.4">NIGHTWARDER</text>
    <text x="328" y="54" fill="#c8b888" font-size="10" font-weight="600" letter-spacing="1.4" text-anchor="end">KIT COVER</text>
  </g>
  <line x1="32" y1="66" x2="328" y2="66" stroke="#d4b03a" stroke-opacity="0.35" stroke-width="1"/>

  
      <g transform="translate(180 198)">
        <path d="M0 -48 L48 0 L0 48 L-48 0 Z" fill="none" stroke="#d4b03a" stroke-width="4"/>
        <rect x="-4" y="-18" width="8" height="22" rx="2" fill="#d4b03a"/>
        <circle cx="0" cy="16" r="5" fill="#d4b03a"/>
      </g>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="32" y="310" fill="#f6f1dc" font-size="26" font-weight="700">Exposure / near-miss</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="336" fill="#c8b888" font-size="13">Blank log template</text>
    <rect x="32" y="354" width="118" height="22" rx="11" fill="#d4b03a" fill-opacity="0.16" stroke="#d4b03a" stroke-opacity="0.45"/>
    <text x="91" y="369" fill="#d4b03a" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">LOG KIT</text>
    <text x="32" y="416" fill="#c8b888" font-size="11">Blank template cover</text>
    <text x="32" y="434" fill="#c8b888" font-size="11" opacity="0.8">Not a live spreadsheet screenshot</text>
  </g>
</svg>
