<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-label="NightWarder kit cover: Apparatus inspection">
  <title>NightWarder kit cover — Apparatus inspection</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1212"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e261c"/>
      <stop offset="1" stop-color="#c24a36"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#f6e8e6" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="360" height="480" fill="url(#bg)"/>
  <rect width="360" height="480" fill="url(#grid)"/>
  <rect x="0" y="0" width="360" height="10" fill="url(#bar)"/>
  <rect x="18" y="18" width="324" height="444" rx="10" fill="none" stroke="#c24a36" stroke-opacity="0.28" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="54" fill="#c24a36" font-size="11" font-weight="700" letter-spacing="2.4">NIGHTWARDER</text>
    <text x="328" y="54" fill="#c4a29c" font-size="10" font-weight="600" letter-spacing="1.4" text-anchor="end">KIT COVER</text>
  </g>
  <line x1="32" y1="66" x2="328" y2="66" stroke="#c24a36" stroke-opacity="0.35" stroke-width="1"/>

  
      <g transform="translate(180 198)">
        <rect x="-54" y="-10" width="78" height="28" rx="4" fill="#c24a36"/>
        <rect x="18" y="-2" width="32" height="20" rx="3" fill="#c24a36" opacity="0.75"/>
        <rect x="-46" y="-22" width="36" height="14" rx="2" fill="#c24a36" opacity="0.55"/>
        <circle cx="-28" cy="24" r="9" fill="none" stroke="#f6e8e6" stroke-width="3"/>
        <circle cx="22" cy="24" r="9" fill="none" stroke="#f6e8e6" stroke-width="3"/>
      </g>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="32" y="310" fill="#f6e8e6" font-size="26" font-weight="700">Apparatus inspection</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="336" fill="#c4a29c" font-size="13">Blank inspection log</text>
    <rect x="32" y="354" width="118" height="22" rx="11" fill="#c24a36" fill-opacity="0.16" stroke="#c24a36" stroke-opacity="0.45"/>
    <text x="91" y="369" fill="#c24a36" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">LOG KIT</text>
    <text x="32" y="416" fill="#c4a29c" font-size="11">Blank template cover</text>
    <text x="32" y="434" fill="#c4a29c" font-size="11" opacity="0.8">Not a live spreadsheet screenshot</text>
  </g>
</svg>
